name: UITests

# kurlUITests 스모크 — swiftlint 만으로는 UI 테스트가 방치돼 드리프트하므로,
# PR 마다 시뮬레이터에서 실제로 돌려 회귀를 조기에 드러낸다.
#
# 비필수(informational) 로 시작하는 이유:
#   1) UI 테스트는 느리고 간헐적(flaky)이다. 첫 도입부터 required 로 걸면
#      멀쩡한 PR 이 인프라 흔들림으로 막힌다.
#   2) 러너는 업로드 아카이브와 같은 정식 Xcode 26.x 로 빌드한다. 로컬 개발의
#      Xcode 27 베타와 컴파일러가 달라 빌드가 빨간불일 수 있다. 그 사실을 CI 를
#      막지 않고 보이게만 한다(continue-on-error + 결과 아티팩트/요약).
#
# 안정화되면 job 의 continue-on-error 를 지우고 required 체크로 승격 권장.

on:
  pull_request:
    paths:
      - 'kurl/**/*.swift'
      - 'kurl/kurl.xcodeproj/**'
      - '.github/workflows/uitests.yml'
  workflow_dispatch:

concurrency:
  group: uitests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uitests:
    name: kurlUITests (iOS Simulator)
    runs-on: macos-26
    # 위 헤더 근거로 첫 도입은 비필수. 빨간불이어도 PR 을 막지 않는다.
    continue-on-error: true
    timeout-minutes: 45

    env:
      SCHEME: kurlUITests
      PROJECT: kurl/kurl.xcodeproj
      RESULT_BUNDLE: TestResults.xcresult
      SMOKE: >-
        -only-testing:kurlUITests/GraphNotificationsUITests
        -only-testing:kurlUITests/PushTapRouteUITests
        -only-testing:kurlUITests/EngagementDockUITests
        -only-testing:kurlUITests/ExploreOpensPostUITests

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # 업로드 아카이브와 같은 정식판: 설치된 것 중 가장 최신 26.x 를 고른다.
        run: |
          set -euo pipefail
          echo "설치된 Xcode 목록:"
          for app in /Applications/Xcode*.app; do echo "  $app"; done
          # 26 대 중 가장 높은 버전을 선택. 없으면 러너 기본값 유지.
          LATEST_26=""
          for app in /Applications/Xcode_26*.app; do
            [ -d "$app" ] || continue
            if [ -z "$LATEST_26" ] || [ "$(printf '%s\n%s\n' "$LATEST_26" "$app" | sort -V | tail -1)" = "$app" ]; then
              LATEST_26="$app"
            fi
          done
          if [ -n "$LATEST_26" ]; then
            sudo xcode-select -s "$LATEST_26/Contents/Developer"
          else
            echo "::warning::Xcode 26.x 를 못 찾았다 — 러너 기본 Xcode 로 진행(iOS 26 SDK 없으면 빌드 실패 가능)."
          fi
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-macos-26-${{ hashFiles('kurl/kurl.xcodeproj/project.pbxproj') }}
          restore-keys: |
            deriveddata-macos-26-

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          # SPM 은 러너에서 네트워크로 정상 해석되므로 clonedSourcePackages 는
          # 지정하지 않는다(기본 DerivedData 경로 사용). 캐시로 재해석만 아낀다.
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('kurl/kurl.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'kurl/**/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Boot simulator
        run: |
          set -euo pipefail
          # 이미지엔 런타임마다 iPhone 17 Pro 가 있어, 고른 Xcode 의 시뮬레이터 SDK 런타임 기기로 고정한다.
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          RUNTIME="com.apple.CoreSimulator.SimRuntime.iOS-${SDK//./-}"
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          for v in json.load(sys.stdin)["devices"].get(sys.argv[1], []):
              if v["name"] == "iPhone 17 Pro":
                  print(v["udid"]); break
          ' "$RUNTIME")
          if [ -z "$UDID" ]; then
            echo "::error::$RUNTIME 에 iPhone 17 Pro 가 없음 — 사용 가능 기기:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "DESTINATION=platform=iOS Simulator,id=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array ko-KR
          xcrun simctl spawn "$UDID" defaults write -g AppleLocale ko_KR
          xcrun simctl shutdown "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Run kurlUITests
        # -retry-tests-on-failure + -test-iterations 2: 전체 스위트는 60분 안에 못 끝나 매번 취소됐다 — 알림·푸시·독 스모크만 돌리고, 실패한 테스트만 최대
        # 2회까지 재시도한다.
        # xcbeautify 는 macos 러너 기본 설치. 없으면 raw 로그로 폴백.
        run: |
          set -o pipefail
          FORMAT="cat"
          if command -v xcbeautify >/dev/null 2>&1; then FORMAT="xcbeautify"; fi
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -resultBundlePath "$RESULT_BUNDLE" \
            $SMOKE \
            -retry-tests-on-failure \
            -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO \
            | $FORMAT

      - name: Summarize result
        if: always()
        run: |
          set +e
          if [ -d "$RESULT_BUNDLE" ]; then
            BUNDLE_LINE="- 결과 번들: \`${RESULT_BUNDLE}\` (아티팩트로 업로드됨)"
          else
            BUNDLE_LINE="- 결과 번들 없음(빌드 단계 실패 가능)."
          fi
          {
            echo "## kurlUITests 결과"
            echo ""
            echo "- Xcode: \`$(xcodebuild -version | head -1)\`"
            echo "- iOS Simulator SDK: \`$(xcrun --sdk iphonesimulator --show-sdk-version)\`"
            echo "- Destination: \`${DESTINATION}\`"
            echo "$BUNDLE_LINE"
            echo ""
            echo "> 이 잡은 비필수(informational)다. 자세한 배경은 워크플로 상단 주석 참고."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kurlUITests-result-bundle
          path: ${{ env.RESULT_BUNDLE }}
          if-no-files-found: warn
          retention-days: 7
