name: SwiftLint

on:
  push:
    paths:
      - 'kurl/**/*.swift'
      - '.swiftlint.yml'
      - '.swiftlint-baseline.json'
      - '.github/scripts/swiftlint-ratchet.sh'
      - '.github/swiftlint-fixtures/**'
      - '.github/workflows/swiftlint.yml'
  pull_request:
    paths:
      - 'kurl/**/*.swift'
      - '.swiftlint.yml'
      - '.swiftlint-baseline.json'
      - '.github/scripts/swiftlint-ratchet.sh'
      - '.github/swiftlint-fixtures/**'
      - '.github/workflows/swiftlint.yml'

jobs:
  swiftlint:
    runs-on: ubuntu-latest
    env:
      SWIFTLINT_VERSION: 0.65.0
      SWIFTLINT_SHA256: 79306a34e5c7cc55a220cd108cbb861dcad5f10138dcdf261e2624ae8b0a486b
      SWIFTLINT_REPORTER: github-actions-logging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install SwiftLint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/swiftlint_linux_amd64.zip"
          echo "$SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/swiftlint"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" swiftlint-static -d "$RUNNER_TEMP/swiftlint"
          mv "$RUNNER_TEMP/swiftlint/swiftlint-static" "$RUNNER_TEMP/swiftlint/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - run: swiftlint version
      - name: Fixtures
        run: .github/scripts/swiftlint-ratchet.sh selftest
      - name: Ratchet
        env:
          BASE_REF: ${{ github.base_ref }}
        run: .github/scripts/swiftlint-ratchet.sh check
